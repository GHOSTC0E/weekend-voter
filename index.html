<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekend Date Voting (Nov & Dec)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center py-8 px-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 space-y-6">
        
        <!-- Top Picked Date Banner (Highest Voted Date) -->
        <div id="top-date-card" class="bg-gradient-to-r from-indigo-500 to-purple-600 text-white rounded-xl p-4 text-center shadow-md">
            <p class="text-xs font-semibold uppercase tracking-wider text-indigo-100">Top Picked Date</p>
            <h2 id="top-date-display" class="text-xl font-bold mt-1">No votes yet</h2>
            <p id="top-date-count" class="text-xs text-indigo-100 mt-0.5">Be the first to vote below!</p>
        </div>

        <!-- Header -->
        <div class="text-center">
            <h1 class="text-2xl font-bold text-indigo-600">Weekend Date Voting</h1>
            <p class="text-sm text-slate-500 mt-1">Pick your best Friday, Saturday, or Sunday for Nov & Dec!</p>
        </div>

        <!-- Step 1: Enter Name -->
        <div id="name-section" class="space-y-3">
            <label class="block text-sm font-medium text-slate-700">Enter your name to start:</label>
            <input type="text" id="username" placeholder="e.g. Audit" class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            <button onclick="startVoting()" class="w-full bg-indigo-600 text-white font-medium py-2.5 rounded-xl hover:bg-indigo-700 transition">
                Continue to Dates
            </button>
        </div>

        <!-- Step 2: Pick Date (Hidden initially) -->
        <div id="voting-section" class="hidden space-y-4">
            <div class="flex justify-between items-center bg-indigo-50 p-3 rounded-xl">
                <span class="text-sm text-indigo-900 font-medium">Voting as: <strong id="display-name" class="text-indigo-600"></strong></span>
                <button onclick="changeName()" class="text-xs text-indigo-500 underline hover:text-indigo-700">Change</button>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Select ONE date you are free:</label>
                <select id="date-select" class="w-full px-4 py-2.5 border rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                    <option value="">-- Choose a Weekend Date --</option>
                    <!-- November -->
                    <optgroup label="November Weekends">
                        <option value="Fri, Nov 6">Fri, Nov 6</option>
                        <option value="Sat, Nov 7">Sat, Nov 7</option>
                        <option value="Sun, Nov 8">Sun, Nov 8</option>
                        <option value="Fri, Nov 13">Fri, Nov 13</option>
                        <option value="Sat, Nov 14">Sat, Nov 14</option>
                        <option value="Sun, Nov 15">Sun, Nov 15</option>
                        <option value="Fri, Nov 20">Fri, Nov 20</option>
                        <option value="Sat, Nov 21">Sat, Nov 21</option>
                        <option value="Sun, Nov 22">Sun, Nov 22</option>
                        <option value="Fri, Nov 27">Fri, Nov 27</option>
                        <option value="Sat, Nov 28">Sat, Nov 28</option>
                        <option value="Sun, Nov 29">Sun, Nov 29</option>
                    </optgroup>
                    <!-- December -->
                    <optgroup label="December Weekends">
                        <option value="Fri, Dec 4">Fri, Dec 4</option>
                        <option value="Sat, Dec 5">Sat, Dec 5</option>
                        <option value="Sun, Dec 6">Sun, Dec 6</option>
                        <option value="Fri, Dec 11">Fri, Dec 11</option>
                        <option value="Sat, Dec 12">Sat, Dec 12</option>
                        <option value="Sun, Dec 13">Sun, Dec 13</option>
                        <option value="Fri, Dec 18">Fri, Dec 18</option>
                        <option value="Sat, Dec 19">Sat, Dec 19</option>
                        <option value="Sun, Dec 20">Sun, Dec 20</option>
                        <option value="Fri, Dec 25">Fri, Dec 25</option>
                        <option value="Sat, Dec 26">Sat, Dec 26</option>
                        <option value="Sun, Dec 27">Sun, Dec 27</option>
                    </optgroup>
                </select>
            </div>

            <button onclick="saveVote()" class="w-full bg-emerald-600 text-white font-medium py-2.5 rounded-xl hover:bg-emerald-700 transition">
                Save My Vote
            </button>
        </div>

        <!-- Results Section -->
        <div class="border-t pt-4 space-y-3">
            <h2 class="font-semibold text-slate-700 text-sm">Live Votes Summary:</h2>
            <div id="results-list" class="space-y-2 max-h-48 overflow-y-auto text-sm bg-slate-50 p-3 rounded-xl border">
                <p class="text-slate-400 text-center italic">No votes recorded yet.</p>
            </div>

            <button onclick="copyForWhatsApp()" class="w-full bg-slate-800 text-white font-medium py-2.5 rounded-xl hover:bg-slate-900 transition text-sm">
                Copy Results for WhatsApp 📋
            </button>
        </div>

    </div>

    <script>
        let currentUser = "";
        let votes = JSON.parse(localStorage.getItem('weekend_votes') || "{}");

        function startVoting() {
            const nameInput = document.getElementById('username').value.trim();
            if (!nameInput) {
                alert("Please enter your name first!");
                return;
            }
            currentUser = nameInput;
            document.getElementById('display-name').innerText = currentUser;
            document.getElementById('name-section').classList.add('hidden');
            document.getElementById('voting-section').classList.remove('hidden');

            if (votes[currentUser]) {
                document.getElementById('date-select').value = votes[currentUser];
            }
        }

        function changeName() {
            document.getElementById('voting-section').classList.add('hidden');
            document.getElementById('name-section').classList.remove('hidden');
        }

        function saveVote() {
            const selectedDate = document.getElementById('date-select').value;
            if (!selectedDate) {
                alert("Please select a date!");
                return;
            }
            votes[currentUser] = selectedDate;
            localStorage.setItem('weekend_votes', JSON.stringify(votes));
            renderResults();
            alert("Vote saved successfully!");
        }

        function renderResults() {
            const list = document.getElementById('results-list');
            const entries = Object.entries(votes);
            
            if (entries.length === 0) {
                list.innerHTML = '<p class="text-slate-400 text-center italic">No votes recorded yet.</p>';
                document.getElementById('top-date-display').innerText = "No votes yet";
                document.getElementById('top-date-count').innerText = "Be the first to vote below!";
                return;
            }

            // Render live voter list
            list.innerHTML = entries.map(([name, date]) => `
                <div class="flex justify-between items-center bg-white p-2 rounded-lg border text-xs">
                    <span class="font-semibold text-slate-700">${name}</span>
                    <span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded font-medium">${date}</span>
                </div>
            `).join('');

            // Calculate most selected date
            const dateCounts = {};
            entries.forEach(([_, date]) => {
                dateCounts[date] = (dateCounts[date] || 0) + 1;
            });

            let topDate = "";
            let maxVotes = 0;
            for (const [date, count] of Object.entries(dateCounts)) {
                if (count > maxVotes) {
                    maxVotes = count;
                    topDate = date;
                }
            }

            document.getElementById('top-date-display').innerText = topDate;
            document.getElementById('top-date-count').innerText = `${maxVotes} vote${maxVotes > 1 ? 's' : ''}`;
        }

        function copyForWhatsApp() {
            const entries = Object.entries(votes);
            if (entries.length === 0) {
                alert("No votes to copy yet!");
                return;
            }
            let text = "🗓️ *Weekend Date Voting Results*\n\n";
            entries.forEach(([name, date]) => {
                text += `• ${name}: *${date}*\n`;
            });
            navigator.clipboard.writeText(text);
            alert("Results copied to clipboard! Paste it into WhatsApp.");
        }

        renderResults();
    </script>
</body>
</html>
